<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title data-i18n-document-title="screenRecording">Screen recording</title>
    <link rel="stylesheet" type="text/css" href="/styles/capture.css">
    <link rel="stylesheet" type="text/css" href="/styles/recording.css">
    <script type="module" src="/scripts/recording-page.js"></script>
  </head>
  <body>
    <header class="editor-header">
      <div class="capture-info">
        <div class="capture-size">
          <span id="recordingSize"></span>
          <span class="capture-mode-badge i18n" data-i18n="screenRecording"></span>
        </div>
        <div class="capture-details">
          <span id="recordingDate"></span>
          <span id="recordingDuration"></span>
          <span id="recordingFileSize"></span>
        </div>
      </div>
      <div class="editor-actions">
        <button id="downloadVideoButton" class="action-button secondary" type="button" data-i18n-title="downloadVideoTip" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span class="i18n" data-i18n="downloadVideo"></span>
        </button>
        <select id="gifScaleSelect" class="gif-scale-select" data-i18n-title="gifSize"></select>
        <button id="createGifButton" class="action-button primary" type="button" data-i18n-title="createGifTip" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 12h3M8 12v3h3M14 9v6M17 9v6M17 9h2M17 12h1.5"/></svg>
          <span class="i18n" data-i18n="createGif"></span>
        </button>
        <button id="cancelJobButton" class="action-button secondary" type="button" hidden>
          <span class="i18n" data-i18n="cancel"></span>
        </button>
      </div>
    </header>

    <main class="stage recording-stage">
      <video id="recordingVideo" class="recording-video" controls autoplay muted hidden></video>
      <div id="cropOverlay" class="crop-overlay" hidden>
        <div id="cropBox" class="crop-box" hidden><span id="cropSize" class="crop-size"></span></div>
      </div>
      <div id="stageMessage" class="stage-message i18n" data-i18n="loadingRecording"></div>
    </main>

    <footer id="trimPanel" class="trim-panel" hidden>
      <button id="trimStartButton" class="trim-button" type="button" data-i18n-title="trimStartHere">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M18 6l-7 6 7 6"/></svg>
      </button>
      <div class="trim-slider">
        <div class="trim-track"><div id="trimSelection" class="trim-selection"></div></div>
        <input id="trimStart" class="trim-handle" type="range" min="0" max="1" step="0.01" value="0" data-i18n-title="trimStart">
        <input id="trimEnd" class="trim-handle" type="range" min="0" max="1" step="0.01" value="1" data-i18n-title="trimEnd">
      </div>
      <button id="trimEndButton" class="trim-button" type="button" data-i18n-title="trimEndHere">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 4v16M6 6l7 6-7 6"/></svg>
      </button>
      <span id="trimLabel" class="trim-label"></span>
      <div class="crop-controls">
        <button id="cropButton" class="trim-button crop-button" type="button" data-i18n-title="cropFrameHint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v16h16M2 6h16v16"/></svg>
          <span id="cropButtonText"></span>
        </button>
        <button id="resetCropButton" class="trim-button" type="button" data-i18n-title="cropReset" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
