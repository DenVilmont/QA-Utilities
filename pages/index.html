<!doctype html>
<html>
  <head>
    <title data-i18n-document-title="appName">QA Utilities</title>
    <link rel="stylesheet" type="text/css" href="/styles/main.css">
    <script type="module" src="/scripts/main.js" defer></script>
  </head>
  <body>
    <div class="header">
      <h1><span class="i18n" data-i18n="appName"></span></h1>
      <div class="divider"></div>
      <div class="tabs-header">
        <span class="tab-header i18n" id="tab1" data-i18n="utils"></span>
        <span class="tab-header i18n" id="tab2" data-i18n="notes"></span>
        <span class="tab-header i18n" id="tab3" data-i18n="tools"></span>
      </div>
      <div class="divider"></div>
    </div>
    <div class="content">
      <div class="tab-content tab1">
        <div class="randomText">
          <h3><span class="i18n" data-i18n="generateTextLine"></span></h3>
          <div class="flex-height-container">
            <input id="textLength" class="flex-height" type="text" data-i18n-placeholder="textLength" />
            <button id="generateText" data-i18n-title="generate">&#x2b6e;</button>
          </div>
          <h4>
            <span class="i18n" data-i18n="lengthOfTheText"></span>
            <span id="textLengthResult"></span>
          </h4>
          <h4>
            <input type="checkbox" id="loremIpsumText">
            <label for="loremIpsumText" class="i18n" data-i18n="loremIpsum"></label>
          </h4>
          <div class="flex-height-container">
            <textarea id="randomTextTextarea" rows="5" cols="30"></textarea>
            <button id="copyRandomTextButton" class="copyTextButton" data-i18n-title="copy">&#x1f5d0;</button>
            <button id="clearRandomTextButton" class="clearTextButton" data-i18n-title="clear">&#x26cc;</button>
          </div>
        </div>

        <div>
          <h3><span class="i18n" data-i18n="GenerateHEXsimbolAndCopy"></span></h3>
          <div class="flex-height-container hex-input-container">
            <input id="hexCharText" class="flex-height" type="text" placeholder="0x1a" value="0x00"/>
            <div class="hex-controls">
              <button id="hexUp" class="hex-btn" data-i18n-title="hexUp">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 15l8-8 8 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button id="hexDown" class="hex-btn" data-i18n-title="hexDown">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 9l8 8 8-8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <button id="copyHexButton" class="copyTextButton" data-i18n-title="copy">&#x1f5d0;</button>
            <button id="clearHexButton" class="clearTextButton" data-i18n-title="clear">&#x26cc;</button>
          </div>
        </div>
        <div class="divider"></div>

        <div class="test-data">
          <h3 class="section-header">
            <span class="i18n" data-i18n="testData"></span>
            <button id="testDataSettingsButton" class="settings-button" type="button" data-i18n-title="testDataSettings" data-i18n-aria-label="testDataSettings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
              </svg>
            </button>
          </h3>
          <div class="flex-height-container">
            <select id="testDataGroupSelect" class="test-data-select"></select>
            <button id="clearTestDataGroupButton" class="clearTextButton" type="button" data-i18n-title="testDataHideValues" hidden>&#x26cc;</button>
          </div>
          <div id="insertModeButtons" class="insert-modes" hidden>
            <button type="button" class="insert-mode-button active" data-mode="copy" data-i18n="insertModeCopy" data-i18n-title="insertModeCopyHint"></button>
            <button type="button" class="insert-mode-button" data-mode="type" data-i18n="insertModeType" data-i18n-title="insertModeTypeHint"></button>
            <button type="button" class="insert-mode-button" data-mode="bypass" data-i18n="insertModeBypass" data-i18n-title="insertModeBypassHint"></button>
          </div>
          <div id="testDataValues" class="test-data-values" role="list"></div>
        </div>
      </div>

      <div class="tab-content tab2">
        <h3 class="notepad-header">
          <span class="i18n" data-i18n="notepad"></span>
          <button id="clearNotebookButton" class="clearTextButton" data-i18n-title="clear">&#x26cc;</button>
        </h3>
        <textarea id="notebook" rows="10" cols="30" data-i18n-placeholder="WriteYourNotesHere"></textarea>
        <h3><span class="i18n" data-i18n="SaveAndCopyValues"></span></h3>
        <div class="flex-height-container">
          <input id="valueInput" class="flex-height" type="text" data-i18n-placeholder="EnterValueToSave">
          <button id="saveValueButton" class="i18n" data-i18n="save"></button>
        </div>
        <div id="savedValues" class="list-items"></div>
      </div>
      <div class="tab-content tab3">
        <h3><span class="i18n" data-i18n="screenshot"></span></h3>
        <div class="tool-tiles">
          <button id="captureVisibleButton" class="tool-tile" type="button" data-i18n-title="captureVisibleHint">
            <svg class="tool-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2"/>
              <path d="M8 20h8M12 16v4"/>
            </svg>
            <span class="tool-tile-title i18n" data-i18n="captureVisible"></span>
          </button>
          <button id="captureAreaButton" class="tool-tile" type="button" data-i18n-title="captureAreaHint">
            <svg class="tool-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 3"/>
            </svg>
            <span class="tool-tile-title i18n" data-i18n="captureArea"></span>
          </button>
          <button id="captureFullPageButton" class="tool-tile" type="button" data-i18n-title="captureFullPageHint">
            <svg class="tool-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h8l4 4v14H6z"/>
              <path d="M9 12h6M9 16h6"/>
            </svg>
            <span class="tool-tile-title i18n" data-i18n="captureFullPage"></span>
          </button>
        </div>
        <h3><span class="i18n" data-i18n="screenRecording"></span></h3>
        <div class="tool-tiles">
          <button id="recordButton" class="tool-tile" type="button" data-i18n-title="recordStartHint">
            <svg class="tool-tile-icon record-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="record-start" cx="12" cy="12" r="6"/>
              <rect class="record-stop" x="7" y="7" width="10" height="10" rx="1"/>
            </svg>
            <span id="recordButtonTitle" class="tool-tile-title"></span>
          </button>
        </div>
        <h3 data-i18n-title="autoReloadHint"><span class="i18n" data-i18n="autoReload"></span></h3>
        <div class="reload-timer-controls">
          <div id="reloadTimerPresets" class="reload-timer-presets">
            <button type="button" class="reload-timer-preset" data-seconds="5" data-i18n-title="autoReloadPresetHint">5 <span class="i18n" data-i18n="secondsShort"></span></button>
            <button type="button" class="reload-timer-preset" data-seconds="10" data-i18n-title="autoReloadPresetHint">10 <span class="i18n" data-i18n="secondsShort"></span></button>
            <button type="button" class="reload-timer-preset" data-seconds="30" data-i18n-title="autoReloadPresetHint">30 <span class="i18n" data-i18n="secondsShort"></span></button>
            <button type="button" class="reload-timer-preset" data-seconds="60" data-i18n-title="autoReloadPresetHint">1 <span class="i18n" data-i18n="minutesShort"></span></button>
          </div>
          <input id="reloadTimerSeconds" class="reload-timer-seconds" type="number" min="1" max="86400" step="1" data-i18n-placeholder="autoReloadSecondsPlaceholder" data-i18n-title="autoReloadSecondsHint">
          <button id="reloadTimerStartButton" type="button" class="reload-timer-button" data-i18n-title="autoReloadStart">&#x25b6;</button>
          <button id="reloadTimerStopButton" type="button" class="reload-timer-button" data-i18n-title="autoReloadStop" disabled>&#x25a0;</button>
        </div>
        <div id="reloadTimerList" class="reload-timer-list"></div>
        <h3><span class="i18n" data-i18n="currentSite"></span></h3>
        <div class="tool-tiles">
          <button id="clearSiteDataButton" class="tool-tile" type="button" data-i18n-title="clearSiteDataHint">
            <svg class="tool-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.3-5.6"/>
              <path d="M20 4v5h-5"/>
              <path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
            </svg>
            <span class="tool-tile-title i18n" data-i18n="clearSiteData"></span>
          </button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="footer">
        <div class="version">
          <span id="version"></span>
        </div>
        <div class="language-selector">
          <select id="languageSelect">
            <option value="en">English</option>
            <option value="zh">Chinese</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="ro">Romanian</option>
            <option value="es">Spanish</option>
          </select>
        </div>
    </div>
  </body>
</html>
